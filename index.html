<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funk Automobile - Anhänger Spezialist</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .btn-kleinanzeigen {
            background: #f56c00;
            color: white;
            display: inline-flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-kleinanzeigen:hover {
            background: #e05d00;
            transform: translateY(-2px);
        }
        .kleinanzeigen-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <!-- Header-Bereich -->
    <header>
        <div class="container logo-container">
            <img src="assets/images/logo.png" alt="Funk Automobile Logo" class="logo">
            <div class="header-text">
                <h1>Funk Automobile</h1>
                <p class="header-slogan">PKW-Anhänger · Pferdeanhänger · Fahrzeugtransporter · Kühlanhänger</p>
            </div>
        </div>
    </header>

    <!-- Hauptinhalt -->
    <main class="container">
        <section id="products">
            <div class="product-card">
                <img src="assets/images/pferde-transport.jpg" alt="Pferdeanhänger">
                <div class="product-info">
                    <h3>Pferdeanhänger Premium</h3>
                    <ul class="specs">
                        <li>Für 2-3 Pferde</li>
                        <li>Belüftungssystem</li>
                        <li>Aluminiumrahmen</li>
                    </ul>
                    <p class="price">ab 14.990 €</p>
                    <a href="https://www.kleinanzeigen.de/pro/funk-automobile--1-2-3-4" 
                       class="btn-kleinanzeigen"
                       target="_blank"
                       rel="noopener noreferrer">
                       <svg class="kleinanzeigen-icon" viewBox="0 0 24 24" fill="white">
                           <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                       </svg>
                       Zu Kleinanzeigen
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <script>document.write(new Date().getFullYear())</script> Funk Automobile</p>
        </div>
    </footer>
</body>
</html>
